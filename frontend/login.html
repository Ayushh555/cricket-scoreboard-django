<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gully Scorer - Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<div class="top"><h1>Gully Scorer</h1></div>
<div class="tabs" role="tablist">
  <button type="button" role="tab" id="t-login" aria-selected="true" onclick="setMode('login')">Log in</button>
  <button type="button" role="tab" id="t-register" aria-selected="false" onclick="setMode('register')">Register</button>
</div>
<form id="f">
  <div class="field"><label class="lbl" for="un">Username</label><input id="un" autocomplete="username" required minlength="3" autocapitalize="none"></div>
  <div class="field"><label class="lbl" for="pw">Password</label><input id="pw" type="password" required>
    <span class="lbl" id="hint" hidden style="margin-top:6px">At least 8 characters, not too common, not all numbers.</span></div>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" type="submit" id="go">Log in</button>
</form>
</main>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
