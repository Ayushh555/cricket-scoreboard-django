<!doctype html>
<html lang="en" class="gate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account · The Crease</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<main>
<a class="lbl" href="index.html">&larr; Home</a>
<h2 class="ltitle" id="who">Account</h2>
<h3 class="ah">Change password</h3>
<form id="pw">
  <div class="field"><label class="lbl" for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password" required></div>
  <div class="field"><label class="lbl" for="np">New password</label><input id="np" type="password" autocomplete="new-password" required></div>
  <div class="field"><label class="lbl" for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password" required></div>
  <p class="ok" id="pwok" role="status"></p><p class="err" id="pwerr" role="alert"></p>
  <button class="btn" type="submit">Change password</button>
</form>
</main>
<script src="js/config.js"></script>
<script src="js/account.js"></script>
</body>
</html>
